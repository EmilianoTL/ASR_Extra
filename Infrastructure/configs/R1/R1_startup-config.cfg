! =====================================================================
!  R1 — Cisco c7200 (IOS)   |  Config base para el monitoreo ASR
! ---------------------------------------------------------------------
!  AJUSTA las IPs a tu topología real antes de aplicar.
!  Esquema usado aquí:
!    - Core de gestión:   8.8.8.0/24  (R1=.1, R2=.5, R3=.9, SME=.100) vía Sw1
!    - LAN de R1:         148.204.56.0/24  (gateway .1)
!  IMPORTANTE: NO se configura ningún protocolo de enrutamiento.
!  El comando 'crypto key generate rsa' es de modo EXEC/config interactivo;
!  ejecútalo manualmente (ver README), no forma parte del startup-config.
! =====================================================================
hostname R1
!
ip domain-name lab.local
!
! --- Acceso administrativo (SSH / enable) ---
enable secret enable123
username admin privilege 15 secret cisco123
!
! --- Interfaces ---
interface FastEthernet0/0
 description Core de gestion hacia Sw1 (8.8.8.0/24)
 ip address 8.8.8.1 255.255.255.0
 no shutdown
!
interface FastEthernet0/1
 description LAN R1 (148.204.56.0/24)
 ip address 148.204.56.1 255.255.255.0
 no shutdown
!
! --- SSH para Ansible / Netmiko ---
ip ssh version 2
line vty 0 4
 transport input ssh
 login local
!
! --- SNMPv3 (SHA auth + AES128 priv) ---
snmp-server group GRUPO_V3 v3 priv
snmp-server user snmp_user GRUPO_V3 v3 auth sha authpass123 priv aes 128 privpass123
snmp-server enable traps
! Destino de traps = IP del SME en el core (eth0)
snmp-server host 8.8.8.100 version 3 priv snmp_user
snmp-server location Lab-ASR-Site-R1
snmp-server contact admin@lab.local
!
! --- CDP (descubrimiento de topología) ---
cdp run
!
! --- SIN protocolo de enrutamiento (lo activa la app: RIP u OSPF) ---
!
end
