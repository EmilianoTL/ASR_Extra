! =====================================================================
!  R1 — Cisco c7200 (IOS)   |  Config base para el monitoreo ASR
! ---------------------------------------------------------------------
!  AJUSTA las IPs a tu topología real antes de aplicar.
!  Topología en CADENA: R1 -- R2 -- R3 (R1 solo se conecta a R2).
!  Enlace inter-router con SUBNETEO /30 (punto a punto) de 8.8.8.0/24:
!    - R1<->R2: 8.8.8.0/30   (R1 f0/0 = 8.8.8.1,  R2 = 8.8.8.2)
!  LAN de R1 (gestión, aloja la SME vía Sw1): 148.204.56.0/24 (gw .1)
!  IMPORTANTE: NO se configura ningún protocolo de enrutamiento.
!  'crypto key generate rsa general-keys modulus 1024' se ejecuta manualmente (ver README).
! =====================================================================
hostname R1
!
ip domain-name lab.local
!
enable secret enable123
username admin privilege 15 secret cisco123
!
! --- Enlace inter-router (/30) hacia R2 ---
interface FastEthernet0/0
 description Enlace P2P hacia R2 (8.8.8.0/30)
 ip address 8.8.8.1 255.255.255.252
 no shutdown
!
! --- LAN de gestión (SME) ---
interface FastEthernet1/0
 description LAN de gestion R1 (SME) 148.204.56.0/24
 ip address 148.204.56.1 255.255.255.0
 no shutdown
!
! --- SSH para Ansible / Netmiko ---
ip ssh version 2
line vty 0 4
 transport input ssh
 login local
!
! --- SNMPv3 (SHA auth + DES56 priv) ---
snmp-server group GRUPO_V3 v3 priv
snmp-server user snmp_user GRUPO_V3 v3 auth sha authpass123 priv des56 privpass123
snmp-server enable traps
! Destino de traps = IP del SME en la LAN de R1 (eth0)
snmp-server host 148.204.56.10 version 3 priv snmp_user
snmp-server location Lab-ASR-Site-R1
snmp-server contact admin@lab.local
!
! --- CDP (descubrimiento de topología) ---
cdp run
!
! --- SIN protocolo de enrutamiento (lo activa la app: RIP u OSPF) ---
!
end
