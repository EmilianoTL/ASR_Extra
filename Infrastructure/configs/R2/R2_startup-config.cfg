! =====================================================================
!  R2 — Cisco c7200 (IOS)   |  Config base para el monitoreo ASR
! ---------------------------------------------------------------------
!  Topología en CADENA: R1 -- R2 -- R3 (R2 en medio).
!  Interfaces:
!    f0/0 = LAN PC1  148.204.59.1/24
!    f1/0 = enlace P2P hacia R1  8.8.8.2/30  (8.8.8.0/30)
!    f1/1 = enlace P2P hacia R3  8.8.8.5/30  (8.8.8.4/30)
!  NO se configura ningún protocolo de enrutamiento.
!  'crypto key generate rsa general-keys modulus 1024' se ejecuta manualmente.
! =====================================================================
hostname R2
!
ip domain-name lab.local
!
enable secret enable123
username admin privilege 15 secret cisco123
!
! --- LAN de R2 (PC1) ---
interface FastEthernet0/0
 description LAN R2 (PC1) 148.204.59.0/24
 ip address 148.204.59.1 255.255.255.0
 no shutdown
!
! --- Enlace inter-router (/30) hacia R1 ---
interface FastEthernet1/0
 description Enlace P2P hacia R1 (8.8.8.0/30)
 ip address 8.8.8.2 255.255.255.252
 no shutdown
!
! --- Enlace inter-router (/30) hacia R3 ---
interface FastEthernet1/1
 description Enlace P2P hacia R3 (8.8.8.4/30)
 ip address 8.8.8.5 255.255.255.252
 no shutdown
!
ip ssh version 2
line vty 0 4
 transport input ssh
 login local
!
snmp-server group GRUPO_V3 v3 priv
snmp-server user snmp_user GRUPO_V3 v3 auth sha authpass123 priv des56 privpass123
snmp-server enable traps
snmp-server host 148.204.56.10 version 3 priv snmp_user
snmp-server location Lab-ASR-Site-R2
snmp-server contact admin@lab.local
!
cdp run
!
! --- SIN protocolo de enrutamiento (lo activa la app) ---
!
end
